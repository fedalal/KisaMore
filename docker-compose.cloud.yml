services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - kisamore-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: cloud/Dockerfile
    restart: unless-stopped
    environment:
      KISAMORE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      KISAMORE_CORS_ORIGINS: ${KISAMORE_CORS_ORIGINS}
      KISAMORE_OFFLINE_AFTER_SECONDS: ${KISAMORE_OFFLINE_AFTER_SECONDS:-120}
      KISAMORE_SESSION_DAYS: ${KISAMORE_SESSION_DAYS:-30}
      KISAMORE_COOKIE_SECURE: ${KISAMORE_COOKIE_SECURE:-true}
      KISAMORE_OFFER_HOURS: ${KISAMORE_OFFER_HOURS:-24}
      KISAMORE_PHOTO_DIR: ${KISAMORE_PHOTO_DIR:-/srv/kisamore/data/photos}
      KISAMORE_PHOTO_MAX_BYTES: ${KISAMORE_PHOTO_MAX_BYTES:-2097152}
      KISAMORE_FARM_TIMEZONE: ${KISAMORE_FARM_TIMEZONE:-Europe/Moscow}
      KISAMORE_BOOTSTRAP_FARM_SLUG: ${KISAMORE_BOOTSTRAP_FARM_SLUG}
      KISAMORE_BOOTSTRAP_FARM_NAME: ${KISAMORE_BOOTSTRAP_FARM_NAME}
      KISAMORE_BOOTSTRAP_DEVICE_ID: ${KISAMORE_BOOTSTRAP_DEVICE_ID}
      KISAMORE_BOOTSTRAP_DEVICE_NAME: ${KISAMORE_BOOTSTRAP_DEVICE_NAME}
      KISAMORE_BOOTSTRAP_DEVICE_TOKEN: ${KISAMORE_BOOTSTRAP_DEVICE_TOKEN}
      KISAMORE_MQTT_HOST: ${KISAMORE_MQTT_HOST:-}
      KISAMORE_MQTT_PORT: ${KISAMORE_MQTT_PORT:-1883}
      KISAMORE_MQTT_USERNAME: ${KISAMORE_MQTT_USERNAME:-}
      KISAMORE_MQTT_PASSWORD: ${KISAMORE_MQTT_PASSWORD:-}
      KISAMORE_MQTT_TLS: ${KISAMORE_MQTT_TLS:-false}
      KISAMORE_MQTT_TOPIC_PREFIX: ${KISAMORE_MQTT_TOPIC_PREFIX:-kisamore}
      KISAMORE_ADMIN_EMAIL: ${KISAMORE_ADMIN_EMAIL:-}
      KISAMORE_ADMIN_PASSWORD: ${KISAMORE_ADMIN_PASSWORD:-}
      KISAMORE_ADMIN_NAME: ${KISAMORE_ADMIN_NAME:-KisaMore Admin}
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8080:8000"
    volumes:
      - kisamore-photos:/srv/kisamore/data/photos
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5

  timelapse-worker:
    build:
      context: .
      dockerfile: cloud/Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "cloud.app.timelapse_worker"]
    environment:
      KISAMORE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      KISAMORE_PHOTO_DIR: ${KISAMORE_PHOTO_DIR:-/srv/kisamore/data/photos}
      KISAMORE_TIMELAPSE_CHECK_SECONDS: ${KISAMORE_TIMELAPSE_CHECK_SECONDS:-300}
      KISAMORE_TIMELAPSE_PRESET: ${KISAMORE_TIMELAPSE_PRESET:-veryfast}
      KISAMORE_TIMELAPSE_CRF: ${KISAMORE_TIMELAPSE_CRF:-23}
      KISAMORE_TIMELAPSE_FFMPEG_TIMEOUT: ${KISAMORE_TIMELAPSE_FFMPEG_TIMEOUT:-180}
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - kisamore-photos:/srv/kisamore/data/photos

  watering-worker:
    build:
      context: .
      dockerfile: cloud/Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "cloud.app.watering_worker"]
    environment:
      KISAMORE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      KISAMORE_FARM_TIMEZONE: ${KISAMORE_FARM_TIMEZONE:-Europe/Moscow}
      KISAMORE_WATERING_CHECK_SECONDS: ${KISAMORE_WATERING_CHECK_SECONDS:-300}
      KISAMORE_WATERING_HORIZON_HOURS: ${KISAMORE_WATERING_HORIZON_HOURS:-48}
      KISAMORE_WATERING_LOOKBACK_HOURS: ${KISAMORE_WATERING_LOOKBACK_HOURS:-24}
    depends_on:
      api:
        condition: service_healthy

  telegram-bot:
    build:
      context: .
      dockerfile: cloud/Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "cloud.app.telegram.worker_daily_photos"]
    environment:
      KISAMORE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      KISAMORE_CORS_ORIGINS: ${KISAMORE_CORS_ORIGINS}
      KISAMORE_OFFLINE_AFTER_SECONDS: ${KISAMORE_OFFLINE_AFTER_SECONDS:-120}
      KISAMORE_SESSION_DAYS: ${KISAMORE_SESSION_DAYS:-30}
      KISAMORE_COOKIE_SECURE: ${KISAMORE_COOKIE_SECURE:-true}
      KISAMORE_OFFER_HOURS: ${KISAMORE_OFFER_HOURS:-24}
      KISAMORE_PHOTO_DIR: ${KISAMORE_PHOTO_DIR:-/srv/kisamore/data/photos}
      KISAMORE_PHOTO_MAX_BYTES: ${KISAMORE_PHOTO_MAX_BYTES:-2097152}
      KISAMORE_FARM_TIMEZONE: ${KISAMORE_FARM_TIMEZONE:-Europe/Moscow}
      KISAMORE_BOOTSTRAP_FARM_SLUG: ${KISAMORE_BOOTSTRAP_FARM_SLUG}
      KISAMORE_BOOTSTRAP_FARM_NAME: ${KISAMORE_BOOTSTRAP_FARM_NAME}
      KISAMORE_BOOTSTRAP_DEVICE_ID: ${KISAMORE_BOOTSTRAP_DEVICE_ID}
      KISAMORE_BOOTSTRAP_DEVICE_NAME: ${KISAMORE_BOOTSTRAP_DEVICE_NAME}
      KISAMORE_BOOTSTRAP_DEVICE_TOKEN: ${KISAMORE_BOOTSTRAP_DEVICE_TOKEN}
      KISAMORE_TELEGRAM_BOT_TOKEN: ${KISAMORE_TELEGRAM_BOT_TOKEN}
      KISAMORE_TELEGRAM_BOT_USERNAME: ${KISAMORE_TELEGRAM_BOT_USERNAME:-KisaMoreBot}
      KISAMORE_TELEGRAM_SUPPORT_CONTACT: ${KISAMORE_TELEGRAM_SUPPORT_CONTACT:-}
    depends_on:
      api:
        condition: service_healthy
      timelapse-worker:
        condition: service_started
      watering-worker:
        condition: service_started
    volumes:
      - kisamore-photos:/srv/kisamore/data/photos:ro

volumes:
  kisamore-postgres:
  kisamore-photos:
