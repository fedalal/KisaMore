<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Камеры · KisaMore</title>
  <link rel="stylesheet" href="/static/styles.css?v=20260911-1">
</head>
<body>
  <header class="top">
    <div class="wrap topbar">
      <div class="brand">
        <div class="dot"></div>
        <div>
          <div class="title">Камеры</div>
          <div class="subtitle">Одиночные кадры и настройка изображения</div>
        </div>
      </div>
      <div class="right">
        <button id="backBtn" class="btn btn--ghost">Назад</button>
        <button id="addCameraBtn" class="btn btn--ghost">Добавить камеру</button>
        <button id="saveCamerasBtn" class="btn btn--primary">Сохранить</button>
        <span id="conn" class="pill">⏳ подключение…</span>
      </div>
    </div>
  </header>

  <main class="wrap camerasPage">
    <div class="hint camerasHint">
      Прямой эфир отключён: камера открывается только на время одного снимка. Для выравнивания нажми «Получить кадр», затем «Выбрать точки» и кликни 4 угла на левом изображении: левый верхний, правый верхний, правый нижний, левый нижний.
    </div>
    <div id="cameraCaptureSettings"></div>
    <div id="camerasList"></div>
  </main>

  <script src="/static/cameras.js?v=20260911-1"></script>
  <script src="/static/camera_frames_settings.js?v=20260911-1"></script>
</body>
</html>
