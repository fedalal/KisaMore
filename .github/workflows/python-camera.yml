name: Python Camera

on:
  workflow_dispatch:
  push:
    branches:
      - feature/plant-battle
    paths:
      - "app/**"
      - "cloud/app/**"
      - "tests/test_multi_camera.py"
      - ".github/workflows/python-camera.yml"
  pull_request:
    branches:
      - feature/plant-battle
    paths:
      - "app/**"
      - "cloud/app/**"
      - "tests/test_multi_camera.py"
      - ".github/workflows/python-camera.yml"

jobs:
  camera-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r cloud/requirements.txt PyYAML pytest

      - name: Compile Python sources
        run: python -m compileall -q app cloud/app

      - name: Multi-camera tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_multi_camera.py
