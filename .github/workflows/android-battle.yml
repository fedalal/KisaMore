name: Android Battle

concurrency:
  group: android-battle-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - feature/plant-battle
    paths:
      - "android-battle/**"
      - "cloud/app/battle_api.py"
      - "cloud/app/battle_models.py"
      - ".github/workflows/android-battle.yml"
      - ".github/workflows/android-battle-play.yml"
      - "google-play/**"
  pull_request:
    branches:
      - feature/plant-battle
    paths:
      - "android-battle/**"
      - "cloud/app/battle_api.py"
      - "cloud/app/battle_models.py"
      - ".github/workflows/android-battle.yml"
      - ".github/workflows/android-battle-play.yml"
      - "google-play/**"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true

      - name: Install Android 16 / API 36
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Install Firebase Android configuration (when connected)
        env:
          FIREBASE_ANDROID_JSON_B64: ${{ secrets.KISAMORE_FIREBASE_ANDROID_JSON_B64 }}
        run: |
          if [ -n "$FIREBASE_ANDROID_JSON_B64" ]; then
            printf '%s' "$FIREBASE_ANDROID_JSON_B64" | base64 --decode > android-battle/app/google-services.json
            python3 -c 'import json; from pathlib import Path; p=Path("android-battle/app/google-services.json"); d=json.loads(p.read_text()); assert any(c.get("client_info",{}).get("android_client_info",{}).get("package_name")=="farm.kisamore.battle" for c in d.get("client", [])), "Firebase package does not match"; print("Firebase Android config loaded")'
          else
            echo "Firebase Android config not configured; inbox polling remains enabled."
          fi

      - name: Unit tests
        run: gradle -p android-battle testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle -p android-battle assembleDebug --stacktrace

      - name: Verify built APK version and copy with official filename
        run: |
          grep -Fq 'versionCode = 43' android-battle/app/build.gradle.kts
          grep -Fq 'versionName = "0.6.28"' android-battle/app/build.gradle.kts
          test -s android-battle/app/build/outputs/apk/debug/app-debug.apk
          cp android-battle/app/build/outputs/apk/debug/app-debug.apk KisaMore-Battle-0.6.28.apk

      - name: Restore original Google Play signing key
        env:
          KEYSTORE_B64: ${{ secrets.KISAMORE_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KISAMORE_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KISAMORE_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KISAMORE_UPLOAD_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/kisamore-upload-key.jks"
          EXPECTED="13:CC:46:3F:9A:EE:39:28:BF:BA:AA:7A:9A:6C:94:46:B1:17:AE:F1:A6:4D:8F:C7:4B:48:B5:51:63:FE:DE:03"
          ACTUAL="$(keytool -list -v -keystore "$RUNNER_TEMP/kisamore-upload-key.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | sed -n 's/^[[:space:]]*SHA256: //p' | head -1)"
          test "$ACTUAL" = "$EXPECTED"
          echo "Original Play upload certificate verified"

      - name: Build signed release APK
        env:
          KISAMORE_UPLOAD_STORE_FILE: ${{ runner.temp }}/kisamore-upload-key.jks
          KISAMORE_UPLOAD_STORE_PASSWORD: ${{ secrets.KISAMORE_UPLOAD_STORE_PASSWORD }}
          KISAMORE_UPLOAD_KEY_ALIAS: ${{ secrets.KISAMORE_UPLOAD_KEY_ALIAS }}
          KISAMORE_UPLOAD_KEY_PASSWORD: ${{ secrets.KISAMORE_UPLOAD_KEY_PASSWORD }}
        run: gradle -p android-battle assembleRelease --stacktrace

      - name: Verify and name signed release APK
        run: |
          APK=android-battle/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          EXPECTED="13:CC:46:3F:9A:EE:39:28:BF:BA:AA:7A:9A:6C:94:46:B1:17:AE:F1:A6:4D:8F:C7:4B:48:B5:51:63:FE:DE:03"
          ACTUAL=$(/usr/local/lib/android/sdk/build-tools/36.0.0/apksigner verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr '[:lower:]' '[:upper:]' | sed 's/../&:/g;s/:$//')
          test "$ACTUAL" = "$EXPECTED"
          cp "$APK" KisaMore-Battle-0.6.28-GooglePlay-ORIGINAL-key.apk

      - name: Upload signed update APK
        uses: actions/upload-artifact@v4
        with:
          name: KisaMore-Battle-0.6.28-GooglePlay-ORIGINAL-key
          path: KisaMore-Battle-0.6.28-GooglePlay-ORIGINAL-key.apk
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KisaMore-Battle-0.6.28
          path: KisaMore-Battle-0.6.28.apk
          if-no-files-found: error
