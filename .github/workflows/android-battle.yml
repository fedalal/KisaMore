name: Android Battle MVP

on:
  workflow_dispatch:
  push:
    branches:
      - feature/battle-android-mvp
    paths:
      - "android-battle/**"
      - "cloud/app/battle_api.py"
      - "cloud/app/battle_models.py"
      - ".github/workflows/android-battle.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Unit tests
        run: gradle -p android-battle testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle -p android-battle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kisamore-battle-debug-apk
          path: android-battle/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
