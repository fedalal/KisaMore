name: Android Battle

concurrency:
  group: android-battle-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - feature/plant-battle
    paths:
      - "android-battle/**"
      - "cloud/app/battle_api.py"
      - "cloud/app/battle_models.py"
      - ".github/workflows/android-battle.yml"
      - ".github/workflows/android-battle-play.yml"
      - "google-play/**"
  pull_request:
    branches:
      - feature/plant-battle
    paths:
      - "android-battle/**"
      - "cloud/app/battle_api.py"
      - "cloud/app/battle_models.py"
      - ".github/workflows/android-battle.yml"
      - ".github/workflows/android-battle-play.yml"
      - "google-play/**"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true

      - name: Install Android 16 / API 36
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Install Firebase Android configuration (when connected)
        env:
          FIREBASE_ANDROID_JSON_B64: ${{ secrets.KISAMORE_FIREBASE_ANDROID_JSON_B64 }}
        run: |
          if [ -n "$FIREBASE_ANDROID_JSON_B64" ]; then
            printf '%s' "$FIREBASE_ANDROID_JSON_B64" | base64 --decode > android-battle/app/google-services.json
            python3 -c 'import json; from pathlib import Path; p=Path("android-battle/app/google-services.json"); d=json.loads(p.read_text()); assert any(c.get("client_info",{}).get("android_client_info",{}).get("package_name")=="farm.kisamore.battle" for c in d.get("client", [])), "Firebase package does not match"; print("Firebase Android config loaded")'
          else
            echo "Firebase Android config not configured; inbox polling remains enabled."
          fi

      - name: Unit tests
        run: gradle -p android-battle testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle -p android-battle assembleDebug --stacktrace

      - name: Verify built APK version and copy with official filename
        run: |
          grep -Fq 'versionCode = 44' android-battle/app/build.gradle.kts
          grep -Fq 'versionName = "0.6.29"' android-battle/app/build.gradle.kts
          test -s android-battle/app/build/outputs/apk/debug/app-debug.apk
          cp android-battle/app/build/outputs/apk/debug/app-debug.apk KisaMore-Battle-0.6.29.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KisaMore-Battle-0.6.29
          path: KisaMore-Battle-0.6.29.apk
          if-no-files-found: error
