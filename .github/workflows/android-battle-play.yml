name: Android Battle — Google Play AAB

on:
  workflow_dispatch:
  push:
    tags:
      - "battle-v*"

jobs:
  play_bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true

      - name: Install Android 16 / API 36
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Validate signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KISAMORE_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KISAMORE_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KISAMORE_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KISAMORE_UPLOAD_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Missing KISAMORE_UPLOAD_KEYSTORE_BASE64" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "Missing KISAMORE_UPLOAD_STORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing KISAMORE_UPLOAD_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing KISAMORE_UPLOAD_KEY_PASSWORD" && exit 1)

      - name: Restore upload keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KISAMORE_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/kisamore-upload-key.jks"
          keytool -list -keystore "$RUNNER_TEMP/kisamore-upload-key.jks"             -storepass "${{ secrets.KISAMORE_UPLOAD_STORE_PASSWORD }}"             -alias "${{ secrets.KISAMORE_UPLOAD_KEY_ALIAS }}" >/dev/null

      - name: Unit tests
        run: gradle -p android-battle testDebugUnitTest --stacktrace

      - name: Build signed release AAB
        env:
          KISAMORE_UPLOAD_STORE_FILE: ${{ runner.temp }}/kisamore-upload-key.jks
          KISAMORE_UPLOAD_STORE_PASSWORD: ${{ secrets.KISAMORE_UPLOAD_STORE_PASSWORD }}
          KISAMORE_UPLOAD_KEY_ALIAS: ${{ secrets.KISAMORE_UPLOAD_KEY_ALIAS }}
          KISAMORE_UPLOAD_KEY_PASSWORD: ${{ secrets.KISAMORE_UPLOAD_KEY_PASSWORD }}
        run: gradle -p android-battle bundleRelease --stacktrace

      - name: Verify AAB signature
        run: jarsigner -verify -verbose -certs android-battle/app/build/outputs/bundle/release/app-release.aab

      - name: Upload Google Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: kisamore-battle-google-play-aab
          path: android-battle/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90
