<header class="kisa-site-header no-print" data-site-header>
  <div class="kisa-site-inner">
    <a class="kisa-site-brand" href="/" aria-label="KisaMore"><img class="kisa-site-mark" src="/static/kisamore-telegram-icon-v2.png" width="42" height="42" alt="" decoding="async"><strong>KisaMore</strong></a>
    <nav class="kisa-site-nav" aria-label="Main navigation">
      <a href="/#greenhouse" data-site-text="greenhouse">Greenhouse</a>
      <a href="/battle" data-site-text="battles">Battles</a>
      <a href="/pricing" data-site-text="pricing">Pricing</a>
      <a href="/wallet" data-site-text="currency">Kisa Ⓚ</a>
    </nav>
    <div class="kisa-site-actions">
      <div class="kisa-language-picker" data-language-picker>
        <select id="languageSelect" aria-label="Language">
          <option value="en">English</option>
          <option value="ru">Русский</option>
          <option value="de">Deutsch</option>
          <option value="fr">Français</option>
          <option value="es">Español</option>
          <option value="it">Italiano</option>
          <option value="pt">Português</option>
          <option value="pl">Polski</option>
          <option value="zh">中文</option>
        </select>
        <button class="kisa-language-trigger" data-language-trigger type="button" aria-label="Choose language" aria-haspopup="menu" aria-expanded="false">
          <img class="kisa-language-flag" data-language-flag src="/static/flags/gb.svg" alt="" width="24" height="18">
          <svg class="kisa-language-chevron" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="kisa-language-menu" data-language-menu role="menu" aria-label="Choose language" hidden>
          <button class="kisa-language-option" role="menuitemradio" aria-checked="false" tabindex="-1" type="button" data-language="en"><img class="kisa-language-flag" src="/static/flags/gb.svg" alt="" width="24" height="18"><span>English</span></button>
          <button class="kisa-language-option" role="menuitemradio" aria-checked="false" tabindex="-1" type="button" data-language="ru"><img class="kisa-language-flag" src="/static/flags/ru.svg" alt="" width="24" height="18"><span>Русский</span></button>
          <button class="kisa-language-option" role="menuitemradio" aria-checked="false" tabindex="-1" type="button" data-language="de"><img class="kisa-language-flag" src="/static/flags/de.svg" alt="" width="24" height="18"><span>Deutsch</span></button>
          <button class="kisa-language-option" role="menuitemradio" aria-checked="false" tabindex="-1" type="button" data-language="fr"><img class="kisa-language-flag" src="/static/flags/fr.svg" alt="" width="24" height="18"><span>Français</span></button>
          <button class="kisa-language-option" role="menuitemradio" aria-checked="false" tabindex="-1" type="button" data-language="es"><img class="kisa-language-flag" src="/static/flags/es.svg" alt="" width="24" height="18"><span>Español</span></button>
          <button class="kisa-language-option" role="menuitemradio" aria-checked="false" tabindex="-1" type="button" data-language="it"><img class="kisa-language-flag" src="/static/flags/it.svg" alt="" width="24" height="18"><span>Italiano</span></button>
          <button class="kisa-language-option" role="menuitemradio" aria-checked="false" tabindex="-1" type="button" data-language="pt"><img class="kisa-language-flag" src="/static/flags/pt.svg" alt="" width="24" height="18"><span>Português</span></button>
          <button class="kisa-language-option" role="menuitemradio" aria-checked="false" tabindex="-1" type="button" data-language="pl"><img class="kisa-language-flag" src="/static/flags/pl.svg" alt="" width="24" height="18"><span>Polski</span></button>
          <button class="kisa-language-option" role="menuitemradio" aria-checked="false" tabindex="-1" type="button" data-language="zh"><img class="kisa-language-flag" src="/static/flags/cn.svg" alt="" width="24" height="18"><span>中文</span></button>
        </div>
      </div>
      <a class="kisa-site-messages" id="battleMessagesOpen" href="/battle?messages=1" hidden><span aria-hidden="true">✉</span><span class="kisa-sr-only" id="battleMessagesLabel" data-site-text="messages">Messages</span><span id="battleMessagesBadge"></span></a>
      <div class="account-control kisa-account" id="accountControl" data-kisa-account>
        <button id="accountButton" class="account-trigger" type="button" data-account-button aria-haspopup="true" aria-expanded="false">
          <span id="accountAvatar" class="account-avatar" data-account-avatar hidden></span><span id="accountLabel" class="account-name" data-account-label>…</span><span id="accountChevron" class="account-chevron" data-account-chevron hidden aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="m6 9 6 6 6-6"/></svg></span>
        </button>
        <div id="accountDropdown" class="account-dropdown" data-account-menu role="group" aria-label="Account" hidden>
          <span class="account-menu-caption" data-account-caption data-site-text="signedInAs">Signed in as</span>
          <strong id="accountFullName" class="account-menu-name" data-account-name></strong><span id="accountEmail" class="account-menu-email" data-account-email></span>
          <a class="account-menu-link" data-account-profile data-site-text="profile" href="/?account=profile">My account</a>
          <a class="account-menu-link" data-account-wallet data-site-text="wallet" href="/wallet">Kisa wallet</a>
          <div class="account-menu-telegram" id="accountTelegramRow" hidden><span>Telegram</span><span id="accountTelegram">—</span></div>
          <span id="walletBalance" class="wallet-balance" hidden></span>
          <button id="accountLogoutButton" class="account-logout" data-account-logout data-site-text="signOut" type="button">Sign out</button>
          <p class="account-error" data-account-error role="alert" hidden></p>
        </div>
      </div>
    </div>
  </div>
</header>
<p class="kisa-language-note no-print" id="siteLanguageNote" role="status" hidden></p>
